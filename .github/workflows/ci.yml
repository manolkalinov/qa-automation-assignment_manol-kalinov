name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  smoke:
    name: Smoke (P0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - run: mvn test -Dsurefire.suiteXmlFiles=src/test/resources/testng-smoke.xml -B -q

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: target/surefire-reports/

  full-regression:
    name: Full Regression
    runs-on: ubuntu-latest
    needs: smoke
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - run: mvn test -Dsurefire.suiteXmlFiles=src/test/resources/testng-full.xml -B -q

      - name: Generate Allure report
        run: mvn allure:report -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-regression-report
          path: target/site/allure-maven-plugin/
